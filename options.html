<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>AivisSpeech 設定</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", "Hiragino Sans", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-width: 380px;
      padding: 32px 24px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    header img { width: 32px; height: 32px; border-radius: 6px; }
    header h1 { font-size: 18px; font-weight: 600; }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px 22px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .row:last-child { margin-bottom: 0; }

    label {
      font-size: 14px;
      font-weight: 500;
      color: #3a3a3c;
    }
    .value-badge {
      font-size: 14px;
      font-weight: 600;
      color: #6e40c9;
      min-width: 42px;
      text-align: right;
    }

    input[type="range"] {
      width: 100%;
      margin-top: 8px;
      accent-color: #6e40c9;
      cursor: pointer;
      height: 4px;
    }

    .hint {
      font-size: 12px;
      color: #8e8e93;
      margin-top: 6px;
    }

    .save-btn {
      width: 100%;
      padding: 10px;
      background: #6e40c9;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .save-btn:hover { background: #5a30b0; }
    .save-btn:active { background: #4a2498; }

    .toast {
      display: none;
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      color: #34c759;
      font-weight: 500;
    }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="icon">
    <h1>AivisSpeech 設定</h1>
  </header>

  <div class="card">
    <div class="row">
      <label for="volume">音量</label>
      <span class="value-badge" id="volume-display">100%</span>
    </div>
    <input type="range" id="volume" min="0" max="200" step="5" value="100">
    <p class="hint">100% が標準音量。200% まで増幅できます。</p>
  </div>

  <button class="save-btn" id="save-btn">設定を保存</button>
  <p class="toast" id="toast">保存しました</p>

  <script src="options.js"></script>
</body>
</html>
